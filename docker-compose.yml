# Runs the backend. There is no database service: rooms live in memory and
# nothing is persisted, so the container is stateless.
#
#   docker compose up
#
# The frontend runs with `npm run dev` in web/ and proxies to the backend.

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Reaches an Ollama running on the host rather than in the container.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
